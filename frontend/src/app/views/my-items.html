<div class="min-h-screen bg-slate-50 px-4 py-8">
  <div class="mx-auto max-w-3xl">
    <h1 class="mb-6 text-2xl font-semibold text-slate-900">My items</h1>

    @if (error()) {
      <p class="mb-4 rounded-lg bg-red-50 px-3 py-2 text-sm text-red-700">
        {{ error() }}
      </p>
    }

    @if (items().length === 0) {
      <p class="text-slate-600">You have no items listed.</p>
    } @else {
      <div class="flex flex-col gap-3">
        @for (item of items(); track item.id) {
          <article
            class="flex items-center gap-4 rounded-lg border border-slate-200 bg-white p-4 shadow-sm"
          >
            <div class="min-w-0 flex-1">
              <h2 class="truncate text-base font-medium text-slate-900">
                {{ item.title }}
              </h2>
              <p class="mt-1 line-clamp-2 text-sm text-slate-600">
                {{ item.description }}
              </p>
              <p class="mt-2 text-sm font-semibold text-slate-900">
                {{ item.price_cents / 100 | currency }}
              </p>
            </div>

            <div class="w-28 shrink-0">
              <app-button
                type="delete"
                htmlType="button"
                [disabled]="deletingId() === item.id"
                (click)="onDelete(item.id)"
              >
                {{ deletingId() === item.id ? 'Deleting…' : 'Delete' }}
              </app-button>
            </div>
          </article>
        }
      </div>
    }
  </div>
</div>
