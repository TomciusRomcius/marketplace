<div class="min-h-screen bg-slate-50 px-4 py-8">
  <div class="mx-auto grid max-w-7xl gap-8 md:grid-cols-2">
    <app-image-carousel [imageUrls]="imageUrls" />

    <div class="flex flex-col gap-4">
      <h1 class="text-3xl font-semibold text-slate-900">{{ item.title }}</h1>
      <p class="text-base leading-relaxed text-slate-600">
        {{ item.description }}
      </p>
      <p class="text-2xl font-semibold text-slate-900">
        {{ item.price_cents / 100 | currency }}
      </p>
      <div class="mt-2 max-w-xs">
        @if (error()) {
          <p class="mb-3 rounded-lg bg-red-50 px-3 py-2 text-sm text-red-700">
            {{ error() }}
          </p>
        }
        <app-button
          type="accent"
          htmlType="button"
          [disabled]="purchasing() || item.status === 'sold'"
          (click)="onBuy()"
        >
          {{ purchasing() ? 'Buying…' : item.status === 'sold' ? 'Sold' : 'Buy' }}
        </app-button>
      </div>
    </div>
  </div>
</div>
