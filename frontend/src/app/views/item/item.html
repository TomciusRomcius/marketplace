<div class="min-h-screen bg-slate-50 px-4 py-8">
  <div class="mx-auto grid max-w-7xl gap-8 md:grid-cols-2">
    <div
      class="aspect-square overflow-hidden rounded-xl border border-slate-200 bg-slate-100"
    >
      @if (firstImageUrl) {
        <img
          [src]="firstImageUrl"
          [alt]="item.title"
          class="h-full w-full object-cover"
        />
      } @else {
        <div
          class="flex h-full w-full items-center justify-center text-sm font-medium text-slate-400"
        >
          No image
        </div>
      }
    </div>

    <div class="flex flex-col gap-4">
      <h1 class="text-3xl font-semibold text-slate-900">{{ item.title }}</h1>
      <p class="text-base leading-relaxed text-slate-600">
        {{ item.description }}
      </p>
      <p class="text-2xl font-semibold text-slate-900">
        {{ item.price_cents / 100 | currency }}
      </p>
      <div class="mt-2 max-w-xs">
        <app-button type="accent" htmlType="button">Buy</app-button>
      </div>
    </div>
  </div>
</div>
