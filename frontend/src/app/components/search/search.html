<label class="mb-6 block max-w-md">
  <span class="mb-1.5 block text-sm font-medium text-slate-700">Search</span>
  <input
    type="search"
    [value]="searchText()"
    (input)="onInput($event)"
    placeholder="Search by title"
    class="w-full rounded-lg border border-slate-300 px-3 py-2 text-slate-900 outline-none transition focus:border-blue-500 focus:ring-2 focus:ring-blue-500/30"
  />
</label>
