<div
  class="relative aspect-square overflow-hidden rounded-xl border border-slate-200 bg-slate-100"
>
  @if (currentImageUrl(); as url) {
    <img [src]="url" alt="" class="h-full w-full object-cover" />
  } @else {
    <div
      class="flex h-full w-full items-center justify-center text-sm font-medium text-slate-400"
    >
      No image
    </div>
  }

  @if (hasPrevImage()) {
    <button
      type="button"
      class="absolute left-3 top-1/2 z-10 flex h-11 w-11 -translate-y-1/2 items-center justify-center rounded-full border border-white/40 bg-black/35 text-white shadow-lg backdrop-blur-sm transition hover:bg-black/50 focus:outline-none focus-visible:ring-2 focus-visible:ring-white/80"
      aria-label="Previous image"
      (click)="goToPrev()"
    >
      <svg
        xmlns="http://www.w3.org/2000/svg"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2.25"
        stroke-linecap="round"
        stroke-linejoin="round"
        class="h-5 w-5"
        aria-hidden="true"
      >
        <path d="M15 18l-6-6 6-6" />
      </svg>
    </button>
  }

  @if (hasNextImage()) {
    <button
      type="button"
      class="absolute right-3 top-1/2 z-10 flex h-11 w-11 -translate-y-1/2 items-center justify-center rounded-full border border-white/40 bg-black/35 text-white shadow-lg backdrop-blur-sm transition hover:bg-black/50 focus:outline-none focus-visible:ring-2 focus-visible:ring-white/80"
      aria-label="Next image"
      (click)="goToNext()"
    >
      <svg
        xmlns="http://www.w3.org/2000/svg"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2.25"
        stroke-linecap="round"
        stroke-linejoin="round"
        class="h-5 w-5"
        aria-hidden="true"
      >
        <path d="M9 18l6-6-6-6" />
      </svg>
    </button>
  }

  @if (imageUrls().length > 1) {
    <div
      class="absolute bottom-4 left-1/2 z-10 flex -translate-x-1/2 items-center gap-1.5 rounded-full bg-black/40 px-2.5 py-1.5 backdrop-blur-sm"
    >
      @for (url of imageUrls(); track $index) {
        <button
          type="button"
          class="rounded-full transition-all duration-200 focus:outline-none focus-visible:ring-2 focus-visible:ring-white/80"
          [class]="
            $index === currentIndex()
              ? 'h-2 w-5 bg-white'
              : 'h-2 w-2 bg-white/45 hover:bg-white/75'
          "
          [attr.aria-label]="'Go to image ' + ($index + 1)"
          [attr.aria-current]="$index === currentIndex() ? 'true' : null"
          (click)="goToIndex($index)"
        ></button>
      }
    </div>
  }
</div>
