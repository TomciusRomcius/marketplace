# PostgreSQL. Versions 9.3 and up are supported.
#
#   Ensure the PostgreSQL gem is defined in your Gemfile
#   gem "pg"
#
default: &default
  adapter: postgresql
  encoding: unicode
  max_connections: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  host: <%= ENV.fetch("DATABASE_HOST", "localhost") %>
  port: <%= ENV.fetch("DATABASE_PORT", 5432) %>
  username: <%= ENV.fetch("DATABASE_USERNAME", "postgres") %>
  password: <%= ENV.fetch("DATABASE_PASSWORD", "postgres") %>

development:
  <<: *default
  database: <%= ENV.fetch("DATABASE_NAME", "marketplace_development") %>

# Warning: The database defined as "test" will be erased and
# re-generated from your development database when you run "rake".
# Do not set this db to the same as development or production.
test:
  <<: *default
  database: marketplace_test

production:
  primary: &primary_production
    <<: *default
    database: <%= ENV.fetch("DATABASE_NAME", "marketplace_production") %>
  cache:
    <<: *primary_production
    database: marketplace_production_cache
    migrations_paths: db/cache_migrate
  queue:
    <<: *primary_production
    database: marketplace_production_queue
    migrations_paths: db/queue_migrate
  cable:
    <<: *primary_production
    database: marketplace_production_cable
    migrations_paths: db/cable_migrate
